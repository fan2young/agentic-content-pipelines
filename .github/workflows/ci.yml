name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install media probes
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Compile scripts
        run: python -m compileall -q skills/audio-first-video/scripts
      - name: Validate context architecture
        run: python skills/audio-first-video/scripts/validate_context_budget.py skills/audio-first-video/context-budget.json --allow-pending-cold-start
      - name: Run deterministic tests
        working-directory: skills/audio-first-video
        run: python -m unittest discover -s tests -v
